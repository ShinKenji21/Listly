[client]
# Hide Streamlit's Deploy button and developer menu so sellers and judges only see Listly.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
# Listly's look: teal brand colour, soft grey background, white cards (cards are styled in style.css).
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F5F7F8"
secondaryBackgroundColor = "#EAF1F0"
textColor = "#1F2933"
linkColor = "#0F766E"
borderColor = "#DDE3E6"
showWidgetBorder = true
baseRadius = "large"
codeFont = "sans-serif"  # copy boxes hold listing text, not code
headingFontWeights = [750, 700, 650, 600, 600, 600]
headingFontSizes = ["2rem", "1.35rem", "1.12rem", "1rem", "1rem", "1rem"]

[server]
# Only this computer can open the app: no Network/External links, nothing reachable from other devices.
address = "localhost"
